[build]
builder = "dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "diabetes-ai-backend"
source = {
  type = "github",
  repo = "islamSalem78/Diabetes-AI-Clinical-Platform",
  branch = "main",
  root = "."
}

[services.env]
NODE_ENV = "production"
